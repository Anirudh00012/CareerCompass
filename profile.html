<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Career Compass | Dashboard</title>

<link href="https://fonts.googleapis.com/css?family=Lato:700|Montserrat:400,600" rel="stylesheet">
<link rel="stylesheet" href="css/bootstrap.min.css">
<link rel="stylesheet" href="css/font-awesome.min.css">
<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<style>

.dashboard{
max-width:1100px;
margin:60px auto;
display:grid;
grid-template-columns:300px 1fr;
gap:30px;
}

.sidebar{
background:white;
border-radius:15px;
padding:25px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
text-align:center;
}

.sidebar img{
width:120px;
border-radius:50%;
margin-bottom:15px;
}

.main{
background:white;
border-radius:15px;
padding:30px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.field{
margin-bottom:15px;
}

.field label{
font-weight:600;
}

.field p{
background:#f5f6fa;
padding:8px;
border-radius:6px;
}

.cards{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
margin-bottom:25px;
}

.card-box{
background:#f7f9fc;
padding:20px;
border-radius:12px;
text-align:center;
}

.card-box h3{
color:#ff9800;
}

.btn-main{
background:linear-gradient(90deg,#ff9800,#f5b400);
border:none;
padding:10px 20px;
border-radius:8px;
font-weight:600;
margin:5px;
}

.skills span{
background:#0d1b5c;
color:white;
padding:5px 10px;
border-radius:20px;
margin:4px;
display:inline-block;
}

#footer{
background:#003366;
color:white;
}

.footer-nav a,.footer-social a{color:white!important;}
.footer-nav a:hover{color:#ff9800!important;}

</style>

</head>

<body>

<header id="header">
<div class="container">
<div class="navbar-header">
<div class="navbar-brand">

</div>
<button class="navbar-toggle"><span></span></button>
</div>

<nav id="nav">
<ul class="main-menu nav navbar-nav navbar-right">
<li><a href="home.html">Home</a></li>
<li><a href="about.html">About</a></li>
<li><a href="features.html">Features</a></li>
<li><a href="Quizes.html">Quiz</a></li>
<li><a href="profile.html">Profile</a></li>
<li><a href="contact.html">Contact</a></li>
</ul>
</nav>
</div>
</header>

<div class="dashboard">

<div class="sidebar">

<img id="photo" src="img/logow.jpeg">
<input type="file" onchange="upload(this)">

<h3 id="name"></h3>
<p id="email"></p>

<button class="btn-main" onclick="logout()">Logout</button>

</div>

<div class="main">

<div class="cards">

<div class="card-box"><h3>Resume</h3><p>Created</p></div>
<div class="card-box"><h3>Skills</h3><p id="skillCount"></p></div>
<div class="card-box"><h3>Career</h3><p>Active</p></div>

</div>

<h4>Personal Info</h4>

<div class="field"><label>Username</label><p id="username"></p></div>

<h4>Skills</h4>
<div class="skills" id="skills"></div>

<h4>Resume Actions</h4>

<button class="btn-main" onclick="downloadPDF()">Download PDF</button>
<button class="btn-main" onclick="downloadImage()">Download Image</button>
<button class="btn-main" onclick="window.location.href='career-roadmap.html'">Career Roadmap</button>

</div>

</div>

<footer id="footer" class="section">
<div class="container">
<div class="row">

<div class="col-md-6">
<div class="footer-logo">
<a class="logo" href="home.html"><img src="img/Career_Compass_1.png"></a>
</div>
</div>

<div class="col-md-6">
<ul class="footer-nav">
<li><a href="home.html">Home</a></li>
<li><a href="about.html">About</a></li>

<li><a href="features.html">Features</a></li>
<li><a href="profile.html">Profile</a></li>
<li><a href="contact.html">Contact</a></li>
</ul>
</div>

</div>

<div id="bottom-footer" class="row">
<div class="col-md-8">
<span>© 2025 Career Compass | Made with ❤️ by Hansika</span>
</div>
</div>

</div>
</footer>

<script>

const user=JSON.parse(localStorage.getItem("careerUser"));
const resume=JSON.parse(localStorage.getItem("resumeData"));

if(!user){location.href="login.html";}

name.innerText=user.fname+" "+user.lname;
email.innerText=user.email;
username.innerText=user.username;

if(resume){
const arr=resume.skills.split(",");
skillCount.innerText=arr.length;
arr.forEach(s=>skills.innerHTML+=`<span>${s}</span>`);
}

function upload(e){
const reader=new FileReader();
reader.onload=()=>photo.src=reader.result;
reader.readAsDataURL(e.files[0]);
}

function logout(){
localStorage.clear();
location.href="login.html";
}

async function downloadPDF(){
const {jsPDF}=window.jspdf;
const pdf=new jsPDF();
pdf.text("Career Compass Resume",10,10);
pdf.save("resume.pdf");
}

function downloadImage(){
html2canvas(document.body).then(c=>{
const a=document.createElement("a");
a.download="dashboard.png";
a.href=c.toDataURL();
a.click();
});
}

</script>

</body>
</html>
